name: TRIADA Media Monitoring

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'collector.py'
      - '.github/workflows/main.yml'
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: write

concurrency:
  group: triada-media-monitoring
  cancel-in-progress: false

jobs:
  search-mentions:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run media monitoring
        run: python collector.py

      - name: Save mentions database
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mentions.json mentions_review.json

          if ! git diff --cached --quiet; then
            git commit -m "Update TRIADA media mentions"
            git push origin HEAD:main
          else
            echo "No new mentions to save"
          fi
