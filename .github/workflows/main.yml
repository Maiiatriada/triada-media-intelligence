name: TRIADA Media Monitoring

on:
  workflow_dispatch:

jobs:
  search-mentions:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Search Google News
        run: python collector.py
